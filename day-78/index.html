<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
        integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog=="
        crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <title>Background Slider</title>
</head>

<body>
    <div class="slider-container">
        <div class="slide active" style="
          background-image: url('https://i.pinimg.com/736x/51/fe/fc/51fefcfe581bd56cebf699c7d841e7d1.jpg');
        "></div>
        <div class="slide" style="
          background-image: url('https://i.pinimg.com/736x/55/39/f1/5539f19b0a8116d2915798a91fead91e.jpg');
        "></div>

        <div class="slide" style="
          background-image: url('https://i.pinimg.com/736x/3c/80/27/3c80274f7d65a559ac790832b7e4af75.jpg');
        "></div>

        <div class="slide" style="
          background-image: url('https://i.pinimg.com/736x/20/16/c0/2016c05c3ee7a223ce635660941d9580.jpg');
        "></div>

        <div class="slide" style="
          background-image: url('https://i.pinimg.com/736x/99/e0/e9/99e0e9583af8e6b420428b1db29ca77f.jpg');
        "></div>

        <div class="slide" style="
          background-image: url('https://i.pinimg.com/736x/2a/b2/60/2ab2606827a8bfba9e76f610fd62df22.jpg');
        "></div>

        <div class="slide" style="
          background-image: url('https://i.pinimg.com/736x/b3/e2/1a/b3e21a942a9bafe67eadd137408dabd0.jpg');
        "></div>

        <button class="arrow left-arrow" id="left">
            <i class="fas fa-arrow-left"></i>
        </button>

        <button class="arrow right-arrow" id="right">
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>
    <script src="script.js"></script>
</body>

</html>
